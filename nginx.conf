# ============================================================
# NOXARA - Nginx Configuration for aaPanel
# Domain: noxara.page
# Root: /www/wwwroot/noxara.page
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name noxara.page www.noxara.page;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name noxara.page www.noxara.page;

    root /www/wwwroot/noxara.page;
    index index.php index.html;

    # SSL (aaPanel auto-manages these)
    ssl_certificate     /www/server/panel/vhost/cert/noxara.page/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/noxara.page/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Static file caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 256k;
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block access to sensitive files
    location ~ /\.(ht|git|env) {
        deny all;
    }
    location ~ /(config|logs|uploads/.*\.php) {
        deny all;
    }

    # Allow uploads directory for images only
    location /uploads/ {
        location ~ \.(php|php5|phtml)$ {
            deny all;
        }
    }

    # Logs
    access_log /www/wwwlogs/noxara.page.log;
    error_log  /www/wwwlogs/noxara.page.error.log;

    # Max upload size
    client_max_body_size 10M;
}
